<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atleta</title>
    <link rel="stylesheet" href="/static/css/CadAtleta.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"> <!-- Fonte Poppins -->
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/images/logo.png" alt="Logo Atleteasy">
        </div>

        <h1>Cadastro de Atleta</h1>

        <form method="POST" action="/cadastro-atleta">
            <div class="form-group">
                <div class="column">
                    <label for="nomeAtleta">Nome</label>
                    <input type="text" id="nomeAtleta" name="nomeAtleta" required>
        
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" required>
        
                    <label for="dataNascimento">Data de Nascimento</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
        
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required>
        
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>
        
                <div class="column">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" required>
        
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" required>
        
                    <label for="numeroEndereco">Número</label>
                    <input type="number" id="numeroEndereco" name="numeroEndereco" required>
        
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento">
        
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
            </div>
        
            <div class="form-buttons">
                <button type="reset" class="btn-limpar">Limpar</button>
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </div>
        </form>
    </div>
</body>
</html>
