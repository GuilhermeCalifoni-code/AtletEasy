<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtletEasy - Criar Peneira</title>
    <link rel="stylesheet" href="/static/css/criarPeneira.css">
</head>
<body>
    <form method="POST" action="/criar-peneira">
        <div class="form-row">
            <div class="form-column">
                <div class="form-group">
                    <label for="nomeClube">Nome do Clube</label>
                    <input type="text" id="nomeClube" name="nomeClube" placeholder="Nome do clube" required>
                </div>
                <div class="form-group">
                    <label for="esportePeneira">Esporte</label>
                    <input type="text" id="esportePeneira" name="esportePeneira" placeholder="Esporte" required>
                </div>
                <div class="form-group">
                    <label for="localPeneira">Local</label>
                    <input type="text" id="localPeneira" name="localPeneira" placeholder="Local" required>
                </div>
            </div>

            <div class="form-column">
                <div class="form-group">
                    <label for="dataInicio">Data de Início</label>
                    <input type="date" id="dataInicio" name="dataInicio" required>
                </div>
                <div class="form-group">
                    <label for="horario">Horário</label>
                    <input type="time" id="horario" name="horario" required>
                </div>
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="number" id="cep" name="cep" placeholder="00000-000" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-column">
                <div class="form-group">
                    <label for="quantidadeMaxima">Quantidade Máxima</label>
                    <input type="number" id="quantidadeMaxima" name="quantidadeMaxima" placeholder="Máximo 50" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <input type="number" id="status" name="status" placeholder="1 para aberta, 0 para fechada" required>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button type="reset">Limpar</button>
            <button type="submit">Cadastrar</button>
        </div>
    </form>
</body>
</html>
