<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtletEasy - Criar Peneira</title>
    <link rel="stylesheet" href="/static/css/criarPeneira.css">
</head>
<body>
    <div class="menu-lateral">
        <img src="/static/images/logo.png" alt="Logo AtletEasy">
        <ul>
            <li><a href="{{ url_for('clube.home_clube') }}">Home Clube</a></li>
            <li><a href="{{ url_for('clube.criar_peneira') }}">Criar Peneira</a></li>
            <li><a href="{{ url_for('clube.gerenciar_peneira') }}">Gerenciar Peneiras</a></li>
        </ul>
    </div>

    <div class="conteudo">
        <h1>Criar Nova Peneira</h1>
        <form method="POST" action="{{ url_for('clube.criar_peneira') }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="esportePeneira">Esporte</label>
                    <input type="text" id="esportePeneira" name="esportePeneira" placeholder="Ex: Futebol, Basquete" required>
                </div>
                <div class="form-group">
                    <label for="Endereco">Endereço</label>
                    <input type="text" id="Endereco" name="Endereco" placeholder="Endereço" required>
                </div>
                <div class="form-group">
                    <label for="Estado">Estado</label>
                    <input type="text" id="Estado" name="Estado" placeholder="Estado" required>
                </div>
                <div class="form-group">
                    <label for="Cidade">Cidade</label>
                    <input type="text" id="Cidade" name="Cidade" placeholder="Cidade" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="DataInicio">Data de Início</label>
                    <input type="date" id="DataInicio" name="DataInicio" required>
                </div>
                <div class="form-group">
                    <label for="DataFinal">Data de Fim</label>
                    <input type="date" id="DataFinal" name="DataFinal" required>
                </div>
                <div class="form-group">
                    <label for="Horario">Horário</label>
                    <input type="time" id="Horario" name="Horario" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Aberto">Aberto</option>
                        <option value="Fechado">Fechado</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="QuantidadeMaxima">Quantidade de Participantes (mínimo 10, máximo 50)</label>
                    <input type="number" id="QuantidadeMaxima" name="QuantidadeMaxima" min="10" max="50" required>
                </div>
            </div>

            <div class="button-group">
                <button type="reset">Limpar</button>
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </div>
</body>
</html>
