<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/editarPerfil.css">
    <title>Editar Perfil</title>
</head>
<body>
    <!-- Menu Lateral -->
    <aside class="menu-lateral">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Atletas">
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('atleta.home_atleta') }}">Home Atleta</a></li>
                <li><a href="{{ url_for('atleta.visualizar_peneiras') }}">Suas Peneiras</a></li>
                <li><a href="{{ url_for('atleta.perfil_atleta') }}">Perfil</a></li>
                <li><a href="{{ url_for('atleta.paga_atleta') }}">Pagamento</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="conteudo">
        <h1>Editar Perfil do Atleta</h1>
        
        <form action="{{ url_for('atleta.editar_perfil') }}" method="POST">
            <!-- Seção: Informações Pessoais -->
            <section class="form-section">
                <h2>Informações Pessoais</h2>
                <div class="form-group">
                    <label for="Posicao">Posição:</label>
                    <input type="text" id="Posicao" name="Posicao" value="{{ atleta['Posicao'] }}" required placeholder="Digite sua posição">
                </div>

                <div class="form-group">
                    <label for="SobreMim">Sobre Mim:</label>
                    <textarea id="SobreMim" name="SobreMim" required placeholder="Fale um pouco sobre você">{{ atleta['SobreMim'] }}</textarea>
                </div>
            </section>

            <!-- Seção: Dados Físicos -->
            <section class="form-section">
                <h2>Dados Físicos</h2>
                <div class="form-group">
                    <label for="Altura">Altura (em metros):</label>
                    <input type="number" step="0.01" id="Altura" name="Altura" value="{{ atleta['Altura'] }}" required placeholder="Ex: 1.75">
                </div>

                <div class="form-group">
                    <label for="Peso">Peso (em kg):</label>
                    <input type="number" step="0.1" id="Peso" name="Peso" value="{{ atleta['Peso'] }}" required placeholder="Ex: 70.5">
                </div>
            </section>

            <!-- Seção: Experiência e Habilidades -->
            <section class="form-section">
                <h2>Experiência e Habilidades</h2>
                <div class="form-group">
                    <label for="Experiencia">Experiência (em anos):</label>
                    <input type="number" id="Experiencia" name="Experiencia" value="{{ atleta['Experiencia'] }}" required placeholder="Ex: 3">
                </div>

                <div class="form-group">
                    <label for="Velocidade">Velocidade (0 a 5):</label>
                    <input type="number" id="Velocidade" name="Velocidade" value="{{ atleta['Velocidade'] }}" min="0" max="5" required>
                </div>

                <div class="form-group">
                    <label for="Tecnica">Técnica (0 a 5):</label>
                    <input type="number" id="Tecnica" name="Tecnica" value="{{ atleta['Tecnica'] }}" min="0" max="5" required>
                </div>

                <div class="form-group">
                    <label for="VisaoDeJogo">Visão de Jogo (0 a 5):</label>
                    <input type="number" id="VisaoDeJogo" name="VisaoDeJogo" value="{{ atleta['VisaoDeJogo'] }}" min="0" max="5" required>
                </div>
            </section>

            <!-- Seção: Estatísticas Recentes -->
            <section class="form-section">
                <h2>Estatísticas Recentes</h2>
                <div class="form-group">
                    <label for="Gols">Gols:</label>
                    <input type="number" id="Gols" name="Gols" value="{{ atleta['Gols'] }}" required placeholder="Número de gols">
                </div>

                <div class="form-group">
                    <label for="Assistencias">Assistências:</label>
                    <input type="number" id="Assistencias" name="Assistencias" value="{{ atleta['Assistencias'] }}" required placeholder="Número de assistências">
                </div>

                <div class="form-group">
                    <label for="Cartoes">Cartões:</label>
                    <input type="number" id="Cartoes" name="Cartoes" value="{{ atleta['Cartoes'] }}" required placeholder="Número de cartões">
                </div>
            </section>

            <!-- Botão de Submissão -->
            <button type="submit">Salvar Alterações</button>
        </form>
    </main>
</body>
</html>
