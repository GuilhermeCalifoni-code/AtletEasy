<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento do Clube - AtletEasy</title>
    <link rel="stylesheet" href="/static/css/pagamentoClube.css">
</head>
<body>
    <div class="menu-lateral">
        <img src="/static/images/logo.png" alt="Logo AtletEasy">
        <ul>
            <li><a href="{{ url_for('clube.home_clube') }}">Home Clube</a></li>
            <li><a href="{{ url_for('clube.criar_peneira') }}">Criar Peneira</a></li>
            <li><a href="{{ url_for('clube.gerenciar_peneira') }}">Gerenciar Peneiras</a></li>
            <li><a href="{{ url_for('clube.confirmar_logout') }}" class="logout">Sair</a></li>
        </ul>
    </div>
    <div class="conteudo">
        <h1>Pagamento do Clube</h1>
        <form action="{{ url_for('clube.paga_clube') }}" method="POST">
            <label for="nomePlano">Plano de Pagamento</label>
            <select name="nomePlano" id="nomePlano" required>
                <option value="Mensal">Mensal</option>
                <option value="Anual">Anual</option>
            </select>
            <button type="submit">Realizar Pagamento</button>
        </form>
    </div>
</body>
</html>
